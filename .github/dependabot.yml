# The audit gate in CI reports an advisory; this is what opens the pull request that fixes it.
version: 2
updates:
  # Actions are pinned to a commit SHA because a tag is a mutable pointer, which
  # makes them the one dependency nobody can update by reading a version range.
  # Dependabot rewrites the SHA and keeps the trailing version comment, so
  # check-action-pins.mjs stays satisfied.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: build
    labels:
      - dependencies
    # One pull request per ecosystem per week rather than per package: every
    # update here has to clear the same sixteen gates, and reviewing them
    # separately costs more than it reveals. Majors stay separate, because a
    # major is a decision rather than a bump.
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # The published package declares these as optional peers and never pins
      # them; which version a consumer installs is the consumer's decision.
      - dependency-name: '@aws-sdk/client-bedrock-runtime'
      - dependency-name: '@google-cloud/vertexai'
