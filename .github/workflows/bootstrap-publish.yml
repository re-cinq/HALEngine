name: Bootstrap publish (single use)

# Publishes 0.2.0 once, with a token, and then this file is deleted.
#
# The registry cannot hold a trusted publisher for a name that has never been
# published, so the first version is the only one that cannot be tokenless. It
# runs here rather than on a laptop for one reason: `id-token: write` below lets
# npm mint the provenance attestation from the GitHub OIDC token even though
# authentication is the secret, so 0.2.0 is not permanently unattested.
#
# Everything about it is deliberately single-use. It is dispatch-only, it
# refuses any version but 0.2.0, it refuses a commit that is not on main, and
# the change that registers the trusted publisher deletes it, revokes the token
# and removes the secret. See specs/hal-engine-npm-release/spec.md § First
# publish for the order those steps run in.
#
# It stages rather than publishes, like publish.yml: the version reaches the
# registry uninstallable and a maintainer approves it with 2FA. If staging
# refuses a token-authenticated publish - which cannot be established before
# this runs once - the fallback is `npm publish` with the same flags, and the
# approval moves from the registry to whoever runs it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Publish 0.2.0 once, with a token
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance only; authentication is NPM_TOKEN below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for staging and provenance
        run: npm install -g npm@^11.15.0

      # Dispatch takes whatever ref the operator picked, and this job holds a
      # publishing credential, so both the commit and the version are checked
      # before anything is built.
      - name: Refuse a commit that is not on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "bootstrap: FAILED - ${GITHUB_SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi
          echo "bootstrap: commit is on main"

      - name: Refuse any version but 0.2.0
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "0.2.0" ]; then
            echo "bootstrap: FAILED - package.json is at ${version}, and this file publishes 0.2.0 only" >&2
            echo "bootstrap: every later version is published by publish.yml, tokenless" >&2
            exit 1
          fi
          echo "bootstrap: version is 0.2.0"

      - name: Install (no build)
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Build chain
        run: npm run check:build-chain

      - name: Smoke (packed tarball)
        run: npm run smoke

      # The pack list is the only place what ships is a fact rather than an
      # intention, and this is the last gate before an immutable version.
      - name: Pack list carries the package and nothing else
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { files, name, version } = JSON.parse(readFileSync("pack.json", "utf8"))[0];
            const paths = files.map((f) => f.path);
            const unwanted = paths.filter((p) => /(^|\/)[^/]*\.test\.[^/]*$/.test(p) || p.endsWith(".map"));
            const missing = ["package.json", "README.md", "LICENSE", "dist/index.js", "dist/index.d.ts"].filter(
              (p) => !paths.includes(p)
            );
            if (unwanted.length > 0 || missing.length > 0) {
              console.error(`pack list rejected: carries ${unwanted.join(", ") || "nothing unwanted"}, missing ${missing.join(", ") || "nothing"}`);
              process.exit(1);
            }
            console.log(`pack list clean: ${paths.length} files for ${name}@${version}`);
          '

      - name: Stage 0.2.0 on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          npm stage publish --access public --provenance --ignore-scripts 2>&1 | tee stage.log
          {
            echo "## 0.2.0 staged - approve it before registering the trusted publisher"
            echo
            echo "The package page's Versions tab -> Approve, with 2FA. Or: \`npm stage list\`, then \`npm stage approve <id>\`."
            echo
            echo '```'
            cat stage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
