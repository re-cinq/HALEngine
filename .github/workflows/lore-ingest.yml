# lore-ingest-version: 5
name: Lore Context Ingest

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'adrs/**'
      - 'runbooks/**'
      - 'specs/**'
      - 'teams/**'
      - '.specify/**'
      # Tests are the other half of every spec citation: Lore resolves each
      # ([validated by](path#Lnn)) against them. A test-only change must
      # re-ingest, or a renamed test outlives itself in the index.
      - '**/*.test.ts'
      # Fixture suites are the gate tests' inputs - "does the first thing", a
      # deliberately skipped case - and must never enter the index as coverage.
      - '!scripts/fixtures/**'
  # Manual backfill. The push trigger above only ever carries a diff, so
  # context that predates this workflow - everything the repo already had at
  # onboarding - is invisible to it. A dispatch sends the full tracked context
  # instead.
  workflow_dispatch:

# Both jobs POST to Lore with their own token; from the repo they read only.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Collect context files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A dispatch runs on whichever ref was picked, and the endpoint has no
          # notion of a branch - backfilling from a feature branch would land
          # that branch's content as the repo's canonical context.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::a backfill must run on ${DEFAULT_BRANCH}, not ${REF_NAME} - context was NOT ingested"
            exit 1
          fi
          # Kept in step with the push paths filter above. Bare directory
          # pathspecs match recursively, and one that matches nothing is not an
          # error, so a repo without runbooks/ needs no guard here. An array,
          # quoted at the point of use: the test glob and the exclude are single
          # pathspecs for git to interpret, and word-splitting a flat string
          # would hand the shell a glob to expand against the working tree first.
          CONTEXT_PATHS=(
            CLAUDE.md
            AGENTS.md
            adrs
            runbooks
            specs
            teams
            .specify
            # Ingesting no tests is how every one of this repo's spec citations
            # was reported as file-missing: Lore held the specs and nothing to
            # resolve them against.
            '*.test.ts'
            ':(exclude)scripts/fixtures/**'
          )
          # A root commit has no HEAD~1, where the bare diff below exited 128
          # and took the step down under `bash -e` - which is how the very first
          # push, the one carrying the whole corpus, ingested nothing. Treat it
          # like a dispatch and send everything.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "Backfilling the full tracked context (event: ${EVENT_NAME})"
            # Scoped to CONTEXT_PATHS deliberately: the diff arm below reports
            # whatever the commit touched and lets Lore filter, but a backfill
            # unscoped would ship the entire tree.
            FILES=$(git ls-files -- "${CONTEXT_PATHS[@]}" | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            # --no-renames: a moved file must arrive as its old path (a delete)
            # plus its new path, or the old path's chunks outlive the file.
            # ls-files cannot stand in for this arm: a backfill lists what
            # exists, but an incremental push must also report what was deleted.
            # Same exclusion as the backfill: this arm reports whatever the
            # commit touched, so a commit carrying both a spec and a fixture
            # would file the fixture's test names as coverage.
            FILES=$(git diff --name-only --no-renames HEAD~1 HEAD -- ':(exclude)scripts/fixtures/**' | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

      - name: Notify Lore to ingest
        if: steps.changes.outputs.files != '[]'
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          # Actions masks secrets automatically but not repository variables, and this
          # value may arrive as either - mask it so the endpoint cannot reach the log.
          if [ -n "${LORE_INGEST_URL}" ]; then echo "::add-mask::${LORE_INGEST_URL}"; fi
          # Misconfiguration (unset URL) is a hard error - a missing secret or
          # variable must never silently fall back and report success.
          if [ -z "${LORE_INGEST_URL}" ]; then
            echo "::error::LORE_INGEST_URL is not set as a repository secret or variable - context was NOT ingested"
            exit 1
          fi
          # Same class of misconfiguration: an unset token means every POST is
          # rejected with 401, which must never pass as a green run.
          if [ -z "${LORE_INGEST_TOKEN}" ]; then
            echo "::error::LORE_INGEST_TOKEN repository secret is not set - context was NOT ingested"
            exit 1
          fi
          # The Authorization header rides in a file so the token never
          # appears on the curl command line (readable in the process table
          # for the request duration; the env var stays readable to same-uid
          # processes, so this narrows the exposure, not eliminates it).
          AUTH_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "${AUTH_FILE}" "${BODY_FILE}"' EXIT
          printf 'Authorization: Bearer %s\n' "${LORE_INGEST_TOKEN}" > "${AUTH_FILE}"
          # Capture the HTTP status instead of curl -f: a blanket warning once
          # masked a permanent 401 (unset token) as transient for a repo's
          # entire history. curl exits non-zero here only when no HTTP
          # response arrived, where -w prints 000.
          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -o "${BODY_FILE}" -w "%{http_code}" -X POST \
            -H @"${AUTH_FILE}" \
            -H "Content-Type: application/json" \
            -d "{
              \"files\": ${FILES},
              \"repo\": \"${{ github.repository }}\",
              \"commit\": \"${{ github.sha }}\"
            }" \
            "${LORE_INGEST_URL}/api/ingest") || CURL_EXIT=$?
          echo "Lore ingest endpoint returned HTTP ${HTTP_STATUS:-000} (curl exit ${CURL_EXIT})"
          # Prefix each body line with '| ': the runner strips leading
          # whitespace before parsing ::workflow-commands::, so only a
          # non-whitespace prefix stops a response body from forging one. The
          # echo keeps the annotations below on a fresh line even when the
          # body has no trailing newline.
          head -c 4096 "${BODY_FILE}" | sed 's/^/| /'
          echo
          # A URL that cannot be parsed (exit 3) or resolved (exit 6) is a
          # misconfigured LORE_INGEST_URL, not a transient blip - hard-fail
          # like the unset checks above. TLS failures (exit 35/51/60) stay in
          # the warn arm below: cert rotation windows are genuinely transient.
          if [ "${CURL_EXIT}" = "3" ] || [ "${CURL_EXIT}" = "6" ]; then
            echo "::error::curl could not reach the configured Lore endpoint (exit ${CURL_EXIT}) - context was NOT ingested"
            exit 1
          fi
          case "${HTTP_STATUS}" in
            2??)
              ;;
            5??|408|429|000|"")
              # Server-side trouble, throttling, or a network blip is
              # plausibly transient - warn and rely on the next doc push to
              # retry. This workflow runs on push to main and never blocks a
              # merge.
              echo "::warning::Lore ingest endpoint returned HTTP ${HTTP_STATUS:-000} (transient - next doc push retries)"
              ;;
            *)
              # Anything else (4xx auth/config, unexpected redirects) is
              # permanent - a retry will not fix it, so fail the run.
              echo "::error::Lore ingest endpoint returned HTTP ${HTTP_STATUS} - context was NOT ingested"
              exit 1
              ;;
          esac

  graph:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [specs, adrs]
    steps:
      - name: Project ${{ matrix.kind }} into the graph
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Same rail as the ingest job: this posts github.sha, so a dispatch
          # from a feature branch would project that branch into the graph.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::a backfill must run on ${DEFAULT_BRANCH}, not ${REF_NAME} - ${{ matrix.kind }} were NOT projected"
            exit 1
          fi
          # Actions masks secrets automatically but not repository variables, and this
          # value may arrive as either - mask it so the endpoint cannot reach the log.
          if [ -n "${LORE_INGEST_URL}" ]; then echo "::add-mask::${LORE_INGEST_URL}"; fi
          # Misconfiguration (unset URL) is a hard error - a missing secret or
          # variable must never silently fall back and report success.
          if [ -z "${LORE_INGEST_URL}" ]; then
            echo "::error::LORE_INGEST_URL is not set as a repository secret or variable - ${{ matrix.kind }} were NOT projected"
            exit 1
          fi
          # Same class of misconfiguration: an unset token means every POST is
          # rejected with 401, which must never pass as a green run.
          if [ -z "${LORE_INGEST_TOKEN}" ]; then
            echo "::error::LORE_INGEST_TOKEN repository secret is not set - ${{ matrix.kind }} were NOT projected"
            exit 1
          fi
          # The Authorization header rides in a file so the token never
          # appears on the curl command line.
          AUTH_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "${AUTH_FILE}" "${BODY_FILE}"' EXIT
          printf 'Authorization: Bearer %s\n' "${LORE_INGEST_TOKEN}" > "${AUTH_FILE}"
          # Capture the HTTP status instead of curl -f: a blanket warning once
          # masked a permanent 401 (unset token) as transient for a repo's
          # entire history. curl exits non-zero here only when no HTTP
          # response arrived, where -w prints 000.
          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -o "${BODY_FILE}" -w "%{http_code}" -X POST \
            -H @"${AUTH_FILE}" \
            -H "Content-Type: application/json" \
            -d "{\"kinds\":[\"${{ matrix.kind }}\"],\"commit\":\"${{ github.sha }}\"}" \
            "${LORE_INGEST_URL}/api/repos/${{ github.repository }}/ingest-graph") || CURL_EXIT=$?
          echo "Lore ingest-graph endpoint returned HTTP ${HTTP_STATUS:-000} (curl exit ${CURL_EXIT})"
          # Prefix each body line with '| ': the runner strips leading
          # whitespace before parsing ::workflow-commands::, so only a
          # non-whitespace prefix stops a response body from forging one. The
          # echo keeps the annotations below on a fresh line even when the
          # body has no trailing newline.
          head -c 4096 "${BODY_FILE}" | sed 's/^/| /'
          echo
          # A URL that cannot be parsed (exit 3) or resolved (exit 6) is a
          # misconfigured LORE_INGEST_URL, not a transient blip - hard-fail
          # like the unset checks above. TLS failures (exit 35/51/60) stay in
          # the warn arm below: cert rotation windows are genuinely transient.
          if [ "${CURL_EXIT}" = "3" ] || [ "${CURL_EXIT}" = "6" ]; then
            echo "::error::curl could not reach the configured Lore endpoint (exit ${CURL_EXIT}) - ${{ matrix.kind }} were NOT projected"
            exit 1
          fi
          case "${HTTP_STATUS}" in
            2??)
              ;;
            5??|408|429|000|"")
              # Server-side trouble, throttling, or a network blip is
              # plausibly transient - warn and rely on the next doc push to
              # retry. This workflow runs on push to main and never blocks a
              # merge.
              echo "::warning::Lore ingest-graph endpoint returned HTTP ${HTTP_STATUS:-000} for ${{ matrix.kind }} (transient - next doc push retries)"
              ;;
            *)
              # Anything else (4xx auth/config, unexpected redirects) is
              # permanent - a retry will not fix it, so fail the run.
              echo "::error::Lore ingest-graph endpoint returned HTTP ${HTTP_STATUS} - ${{ matrix.kind }} were NOT projected"
              exit 1
              ;;
          esac
