name: PR Description Check

on:
  pull_request:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr-description:
    # Dependabot writes its own body with none of these headings, so its PRs could never pass; the author decides, not the actor.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check required sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=()
          for section in "## Why" "## What Changed" "## Testing"; do
            if ! echo "$PR_BODY" | grep -qF "$section"; then
              missing+=("$section")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::PR description is missing required sections: ${missing[*]}"
            echo "Required sections: ## Why, ## What Changed, ## Testing"
            exit 1
          fi
          echo "All required PR description sections are present."
